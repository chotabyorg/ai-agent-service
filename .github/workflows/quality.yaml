name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install service and lint dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt ruff
      - name: Compile service and migration sources
        run: python -m compileall -q api business_capabilities core db migrations models schemas services tests
      - name: Lint changed production and new bridge Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          changed = subprocess.run(
              ["git", "diff", "--name-only", f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}", "--", "*.py"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          production = [path for path in changed if not path.startswith("tests/")]
          tests = [path for path in changed if path.startswith("tests/")]
          bridge_files = [
              path for path in changed
              if path in {
                  "schemas/conversation_effects.py",
                  "services/conversation_effects.py",
                  "migrations/versions/g5_20261015_01_business_effect_acquisition.py",
                  "tests/business_effect_helpers.py",
                  "tests/test_conversation_effects.py",
                  "tests/test_goal5_business_epochs.py",
                  "tests/test_goal5_business_recovery.py",
              }
          ]
          if production:
              subprocess.run([sys.executable, "-m", "ruff", "check", *production], check=True)
          if bridge_files:
              subprocess.run([sys.executable, "-m", "ruff", "check", *bridge_files], check=True)
          # Existing pytest modules intentionally import fixtures and include
          # legacy formatting that default Ruff flags. Keep syntax, undefined
          # names, and invalid control-flow checks on every changed test file.
          if tests:
              subprocess.run(
                  [sys.executable, "-m", "ruff", "check", "--select", "E9,F63,F7,F82", *tests],
                  check=True,
              )
          PY
      - name: Run full PostgreSQL-backed test suite and migration checks
        run: pytest -q
