name: Publish reviewed AI rollback image

on:
  push:
    branches: [codex/ai-compatible-rollback-20261008]

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/ai-compatible-rollback-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Legacy runtime plus two frozen migrations. Local validation: 292 tests
      # before/after; PostgreSQL18 retained credentials, UNKNOWN and receipts.
      - name: Verify reviewed source inputs
        run: >-
          git diff --exit-code
          1856997263ac3fe0f97f972d84a58d3e4ef516b1 HEAD --
          . ':(exclude).github/workflows/rollback-image.yaml'

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/chotabyorg/ai-agent-service:rollback-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/chotabyorg/ai-agent-service
          provenance: true
      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/chotabyorg/ai-agent-service@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

# Publication only. No GitOps mutation, deployment or merge into main.
# Rollback preconditions: BUSINESS_CAPABILITIES_ENABLED=false; managed ingress
# and channel cohorts disabled. Do not start new canonical operations until the
# target runtime is restored. Retained ledger data must remain intact.
