name: Voice latency native tests
on:
  pull_request:
    paths:
      - core/**
      - services/**
      - schemas/**
      - tests/**
      - requirements.txt
      - .github/workflows/voice-latency-tests.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://voice_ci:disposable_runner_only@127.0.0.1:5432/test_ai_voice_ci
      TEST_DATABASE_DISPOSABLE: 'yes'
      PYTHONUTF8: '1'
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start native disposable PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE voice_ci LOGIN CREATEDB PASSWORD 'disposable_runner_only';"
          sudo -u postgres createdb -O voice_ci test_ai_voice_ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run service regressions without containers
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          from xml.etree import ElementTree
          files = sorted(str(p) for p in Path('tests').rglob('test_*.py')
                         if 'goal3_business_cross_service' not in p.parts)
          selected = files[int(os.environ['TEST_SHARD'])::4]
          assert selected
          report = Path('native-results.xml')
          code = subprocess.call([sys.executable, '-m', 'pytest', '-q',
                                  '--junitxml=' + str(report), *selected])
          # Keep a small public result summary; provider payloads, failure text,
          # environment values and captured stdout never leave the job logs.
          lines = ['## Native test results', '',
                   'Shard: ' + os.environ['TEST_SHARD'],
                   'Source: ' + os.environ['GITHUB_SHA'],
                   'Exit code: ' + str(code), '']
          if report.exists():
              try:
                  cases = list(ElementTree.parse(report).iter('testcase'))
              except (ElementTree.ParseError, OSError):
                  lines.append('JUnit report unavailable or malformed; pytest exit code preserved.')
              else:
                  failed = [case for case in cases if case.find('failure') is not None
                            or case.find('error') is not None]
                  lines.append('Cases: ' + str(len(cases)) + '; failed/error: ' + str(len(failed)))
                  lines.extend('- `' + (case.get('classname', '') + '::' + case.get('name', '')).replace('`', '')[:500]
                               + '`' for case in failed[:100])
          else:
              lines.append('No JUnit report: collection or runner failure requires the authenticated log.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          raise SystemExit(code)
          PY
